<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CG Template</title>
    <style>
      html, body {
        background: transparent;
        overflow: hidden;
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>

    // CasparCG's HTML producer calls these globals directly. The bundle
    // below may still be loading when it does, so queue calls until the
    // <nxtv-graphic> element exists, then dispatch straight to it.
    window.__nxtvQueue = [];

    function play(params) {
      if (window.__nxtvGraphic)
        window.__nxtvGraphic.playAction(params);
      else
        window.__nxtvQueue.push(['play', params]);
    }

    function stop(params) {
      if (window.__nxtvGraphic)
        window.__nxtvGraphic.stopAction(params);
      else
        window.__nxtvQueue.push(['stop', params]);
    }

    function update(data) {
      if (window.__nxtvGraphic)
        window.__nxtvGraphic.updateAction({ data: JSON.parse(data) });
      else
        window.__nxtvQueue.push(['update', data]);
    }

    </script>
    <!-- Classic script, not type="module": Chromium/CEF blocks external
         module fetches over file://, which is how CasparCG serves this. -->
    <script src="./nxtv.amcp.js"></script>
  </body>
</html>
